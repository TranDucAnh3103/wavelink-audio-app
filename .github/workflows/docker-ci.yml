# ==============================================================================
# WaveLink Multi-Environment CI/CD Pipeline
# - CI (Kiểm định): Go Backend (Go 1.26) & React Vite + Next.js Frontend (Node 20, Vitest)
# - Auto-Merge to UAT: Khi push nhánh con (dev, feature/*, fix/*, auto/*, refactor/*),
#                      sau khi PASS sẽ tự động tạo PR và merge vào nhánh 'preview' (UAT).
# - UAT / Preview CD: Khi code vào nhánh 'preview', kích hoạt triển khai Vercel (Next.js Edge)
#                      và Backend Render Preview.
# - Production CD: Khi code được merge vào nhánh 'main' hoặc gắn Release Tag (v*.*.*),
#                  hệ thống Build & Push Docker lên GHCR và deploy bản tĩnh qua FTP lên Web Hosting.
# ==============================================================================

name: WaveLink Multi-Environment CI/CD (Production & UAT Preview)

on:
  push:
    branches:
      - main
      - preview
      - dev
      - develop
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'auto/**'
      - 'refactor/**'
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - preview
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Môi trường muốn triển khai thủ công (preview / production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  repository_dispatch:
    types: [package-updated]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

permissions:
  contents: write       # Cấp quyền ghi mã nguồn & tạo release
  packages: write       # Cho phép push Docker Image lên GHCR
  pull-requests: write  # Cho phép tạo và merge Pull Request tự động

jobs:
  # ============================================================================
  # JOB 1: Test & Kiểm định chất lượng mã nguồn Backend Golang
  # ============================================================================
  backend-test:
    name: Backend Test & Lint (Go 1.26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Golang Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Verify Go Dependencies & Tidy
        working-directory: backend
        run: |
          go mod tidy
          go mod verify

      - name: Run Go Vet & Static Checks
        working-directory: backend
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        working-directory: backend
        run: go test -v ./...

  # ============================================================================
  # JOB 2: Test & Kiểm định chất lượng mã nguồn Frontend (Vite + Next.js)
  # ============================================================================
  frontend-test:
    name: Frontend Test & Build Verification (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Suite (Unit & Component Tests)
        working-directory: frontend
        run: npm run test

      - name: Verify Production Vite Build (SPA Package for Hosting)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://wavelink-audio-app-backend-latest.onrender.com/api/v1' }}
          VITE_ITEMS_PER_PAGE: 12
        run: npm run build:vite

      - name: Verify Production Next.js Build (SEO Layer for Vercel)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://wavelink-audio-app-backend-latest.onrender.com/api/v1' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://wavelink-audio-app-backend-latest.onrender.com/api/v1' }}
        run: npm run build

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ============================================================================
  # JOB 3: Tự động tạo PR và merge vào 'preview' (UAT) sau khi kiểm định PASS
  # ============================================================================
  auto-merge-to-preview:
    name: Auto Merge to Preview (Verified UAT)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # Chỉ chạy khi push vào các nhánh làm việc con (dev, feature/*, fix/*, auto/*, refactor/*)
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/preview' && !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    steps:
      - name: Create PR and Auto Merge into Preview
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            console.log(`>>> Kiểm định thành công trên nhánh: ${branch}`);

            // 0. Đảm bảo nhánh base 'preview' luôn tồn tại trên remote
            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'preview'
              });
              console.log('>>> Nhánh base preview đã sẵn sàng.');
            } catch (branchErr) {
              if (branchErr.status === 404) {
                console.log('>>> Nhánh preview chưa tồn tại trên remote. Đang tự động khởi tạo từ default branch...');
                const { data: repoInfo } = await github.rest.repos.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
                const defaultBranch = repoInfo.default_branch || 'main';
                const { data: refData } = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${defaultBranch}`
                });
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'refs/heads/preview',
                  sha: refData.object.sha
                });
                console.log(`>>> Đã khởi tạo thành công nhánh preview từ ${defaultBranch} (SHA: ${refData.object.sha})`);
              } else {
                throw branchErr;
              }
            }

            // 1. Kiểm tra xem đã có PR từ nhánh này vào preview chưa
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'preview',
              state: 'open'
            });

            let pullNumber;
            if (pulls.length > 0) {
              pullNumber = pulls[0].number;
              console.log(`>>> Tìm thấy PR #${pullNumber} đang mở vào nhánh preview.`);
            } else {
              try {
                const { data: newPr } = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `Auto Merge: ${branch} -> preview [Verified UAT]`,
                  head: branch,
                  base: 'preview',
                  body: `### CI/CD Auto-Merge Report (UAT Preview)\n\nToàn bộ các bước kiểm định cho nhánh \`${branch}\` đã hoàn tất xuất sắc:\n- Backend Go 1.26: Test & Lint PASSED\n- Frontend React: Vitest, Vite Build & Next.js Build PASSED\n\nTự động merge vào nhánh \`preview\` để kích hoạt môi trường UAT / Vercel Preview.`
                });
                pullNumber = newPr.number;
                console.log(`>>> Đã tạo mới PR #${pullNumber}.`);
              } catch (createErr) {
                if (createErr.message && createErr.message.includes('No commits between')) {
                  console.log(`>>> Không có commit mới giữa ${branch} và preview. Hoàn tất.`);
                  return;
                }
                throw createErr;
              }
            }

            // 2. Thực hiện merge PR vào preview
            console.log(`>>> Tiến hành merge PR #${pullNumber} vào nhánh preview...`);
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                merge_method: 'squash'
              });
              console.log(`>>> Merge thành công PR #${pullNumber} vào preview!`);
            } catch (mergeErr) {
              if (mergeErr.message && (mergeErr.message.includes('already merged') || mergeErr.message.includes('not mergeable'))) {
                console.log(`>>> Cảnh báo khi merge: ${mergeErr.message}`);
              } else {
                throw mergeErr;
              }
            }

            // 3. Tự động dọn dẹp nhánh tạm (nếu là nhánh auto/* hoặc feat/*)
            if (branch.startsWith('auto/') || branch.startsWith('feat/') || branch.startsWith('feature/')) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                console.log(`>>> Đã dọn dẹp nhánh tạm: ${branch}`);
              } catch (err) {
                console.log(`>>> Bỏ qua xóa nhánh: ${err.message}`);
              }
            }

  # ============================================================================
  # JOB 4: UAT / Preview Delivery (Vercel Preview + Render Preview Hook)
  # CHỈ CHẠY TRÊN NHÁNH 'preview'
  # ============================================================================
  preview-delivery:
    name: UAT / Preview Delivery (Vercel + Render Preview)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: (github.ref == 'refs/heads/preview' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && (inputs.target_env == 'preview' || github.ref == 'refs/heads/preview'))
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # Cách 1: Nếu cấu hình VERCEL_TOKEN, sử dụng Vercel CLI deploy chính xác
      - name: Deploy to Vercel via CLI (Optional)
        id: vercel_cli
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo ">>> Đang triển khai Preview lên Vercel qua Vercel CLI..."
            cd frontend
            npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" || true
            npx vercel build --token="$VERCEL_TOKEN" || true
            PREVIEW_URL=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN" || echo "")
            echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
            echo ">>> Triển khai Vercel CLI thành công: $PREVIEW_URL"
          else
            echo ">>> Bỏ qua Vercel CLI (Chưa thiết lập VERCEL_TOKEN)."
          fi

      # Cách 2: Kích hoạt Vercel Deploy Hook nếu có cấu hình webhook
      - name: Trigger Vercel Deploy Hook (Optional)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK || secrets.VERCEL_PREVIEW_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo ">>> Đang gửi tín hiệu Deploy Hook tới Vercel..."
            curl -s -f -X POST "$VERCEL_DEPLOY_HOOK" || echo "Cảnh báo: Không thể gọi Vercel Deploy Hook."
          else
            echo ">>> Vercel Git Integration tự động deploy nhánh 'preview' khi nhận commit."
          fi

      # Kích hoạt Render Preview Backend nếu có hook
      - name: Trigger Render Preview Backend Deploy Hook (Optional)
        env:
          RENDER_PREVIEW_HOOK: ${{ secrets.RENDER_PREVIEW_DEPLOY_HOOK || secrets.RENDER_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_PREVIEW_HOOK" ]; then
            echo ">>> Đang gửi tín hiệu Deploy Hook tới Render Preview Backend..."
            curl -s -f -X POST "$RENDER_PREVIEW_HOOK" || echo "Cảnh báo: Không thể gọi Render Preview Hook."
          fi

      - name: Report UAT / Preview Status
        run: |
          echo "=========================================================="
          echo "  MÔI TRƯỜNG UAT / PREVIEW ĐÃ TRIỂN KHAI THÀNH CÔNG!"
          echo "  • Nền tảng: Vercel Edge CDN (Next.js App Router)"
          echo "  • Tên miền UAT: https://wavelink-audio-app.vercel.app"
          echo "  • Backend API: Render Cloud Preview Web Service"
          echo "  • Nhánh kiểm định: preview"
          echo "=========================================================="

  # ============================================================================
  # JOB 5: Production Delivery (Web Hosting zHost + Docker GHCR)
  # CHỈ CHẠY TRÊN NHÁNH 'main' HOẶC RELEASE TAGS
  # ============================================================================
  production-delivery:
    name: Production Delivery (Hosting zHost + Docker GHCR)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.target_env == 'production' || github.ref == 'refs/heads/main')) || github.event_name == 'repository_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Image Names to Lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_LOWER=${REPO_LOWER}-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_LOWER=${REPO_LOWER}-frontend" >> $GITHUB_ENV

      - name: Validate Unified Docker Compose Configurations
        run: |
          docker compose config --quiet
          docker compose --profile fullstack config --quiet
          docker compose --env-file env.vps.example config --quiet
          docker compose --env-file env.dev.example config --quiet
          echo "File docker-compose.yml đạt chuẩn cấu hình."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_LOWER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_LOWER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Frontend Image (Production Vite + Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_BASE_URL || secrets.VITE_API_BASE_URL || 'https://wavelink-audio-app-backend-latest.onrender.com/api/v1' }}
            VITE_ITEMS_PER_PAGE=12

      - name: Trigger Production Backend Auto-Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Đang gửi tín hiệu Deploy Hook tới Backend Production..."
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK_URL" || echo "Cảnh báo: Không thể gọi Render Deploy Hook."
          else
            echo "Bỏ qua Deploy Hook (Chưa thiết lập RENDER_DEPLOY_HOOK_URL)."
          fi

      - name: Check FTP Secret
        id: check_ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      # Trích xuất gói tĩnh SPA từ Docker GHCR để deploy lên Web Hosting zHost
      - name: Extract Frontend Package from GHCR Docker Image
        if: steps.check_ftp.outputs.enabled == 'true'
        env:
          PROD_API_URL: ${{ secrets.PROD_API_BASE_URL }}
          TUNNEL_API_URL: ${{ secrets.QUICK_TUNNEL_URL }}
        run: |
          echo ">>> Đang trích xuất static package từ Docker Image GHCR..."
          rm -rf ./frontend/dist-extracted
          mkdir -p ./frontend/dist-extracted
          docker create --name fe_pkg_extract ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_LOWER }}:latest
          docker cp fe_pkg_extract:/usr/share/nginx/html/. ./frontend/dist-extracted/
          docker rm fe_pkg_extract
          # Đảm bảo file .htaccess điều hướng SPA luôn có mặt trong package deploy
          cp ./frontend/public/.htaccess ./frontend/dist-extracted/.htaccess || true
          # Đảm bảo file env-config.js cấu hình runtime cho Web Hosting luôn có mặt
          cp ./frontend/public/env-config.js ./frontend/dist-extracted/env-config.js || true
          RESOLVED_TUNNEL="${PROD_API_URL:-$TUNNEL_API_URL}"
          if [ -n "$RESOLVED_TUNNEL" ]; then
            echo ">>> Ghi đè URL API từ GitHub Secret vào env-config.js: $RESOLVED_TUNNEL"
            printf 'window.__ENV__ = {\n  VITE_API_BASE_URL: "%s",\n  APP_ENV: "production"\n};\n' "$RESOLVED_TUNNEL" > ./frontend/dist-extracted/env-config.js
          fi
          echo ">>> Trích xuất thành công! Danh sách tệp tin trong package:"
          ls -la ./frontend/dist-extracted/

      - name: Resolve FTP Target Directory
        if: steps.check_ftp.outputs.enabled == 'true'
        id: ftp_dir
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          if [ -n "$FTP_SERVER_DIR" ]; then
            echo "target_dir=$FTP_SERVER_DIR" >> $GITHUB_OUTPUT
          elif [ "$FTP_USERNAME" = "wavelink" ]; then
            echo "target_dir=./domains/wavelink-audio-app.zhost.education/public_html/" >> $GITHUB_OUTPUT
          else
            echo "target_dir=./public_html/" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via FTP to Web Hosting (DirectAdmin zHost)
        if: steps.check_ftp.outputs.enabled == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist-extracted/
          server-dir: ${{ steps.ftp_dir.outputs.target_dir }}
          dangerous-clean-slate: false

      - name: Report Production Status
        run: |
          echo "=========================================================="
          echo "  MÔI TRƯỜNG PRODUCTION ĐÃ TRIỂN KHAI THÀNH CÔNG!"
          echo "  • Nền tảng Frontend: Web Hosting zHost (DirectAdmin)"
          echo "  • Tên miền chính thức: https://wavelink-audio-app.zhost.education"
          echo "  • Đã deploy static package qua FTP vào public_html/"
          echo "  • Backend API: Đã build & push Docker image lên GHCR"
          echo "  • Nhánh phát hành: main"
          echo "=========================================================="
