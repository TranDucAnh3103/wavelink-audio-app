user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # GZIP Compression tối ưu hóa tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Bảo mật HTTP Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://www.youtube.com https://s.ytimg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.trycloudflare.com https://wavelink-audio-app-backend-latest.onrender.com https://*.googlevideo.com; connect-src 'self' https://*.trycloudflare.com wss://*.trycloudflare.com https://wavelink-audio-app-backend-latest.onrender.com wss://wavelink-audio-app-backend-latest.onrender.com https://accounts.google.com https://www.googleapis.com https://noembed.com https://www.youtube.com https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'self';" always;

        # Caching vĩnh viễn cho static hashed assets (Vite /assets/)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Runtime env config & Service Worker: không cache
        location ~* ^/(sw\.js|env-config\.js)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # SEO & Agentic Discovery files: phục vụ trực tiếp, không fallback HTML
        location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|ai-catalog\.json|\.well-known/ai-catalog\.json)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Caching ngắn cho favicon / manifest / icons
        location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Reverse Proxy cho API Golang khi triển khai trọn gói trên Docker / Ubuntu Server
        location /api/v1/ {
            proxy_pass http://backend:8080/api/v1/;
            proxy_http_version 1.1;

            # Hỗ trợ kết nối thời gian thực WebSocket cho tính năng Community Chat
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Reverse Proxy cho Direct Audio Stream (tắt buffering để Range 206 hoạt động tức thì)
        location /stream/ {
            proxy_pass http://backend:8080/stream/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Healthcheck endpoint cho Nginx container
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

        # SPA Routing: Fallback toàn bộ các route client về index.html (bật bfcache với no-cache, must-revalidate)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://www.youtube.com https://s.ytimg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.trycloudflare.com https://wavelink-audio-app-backend-latest.onrender.com https://*.googlevideo.com; connect-src 'self' https://*.trycloudflare.com wss://*.trycloudflare.com https://wavelink-audio-app-backend-latest.onrender.com wss://wavelink-audio-app-backend-latest.onrender.com https://accounts.google.com https://www.googleapis.com https://noembed.com https://www.youtube.com https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'self';" always;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
