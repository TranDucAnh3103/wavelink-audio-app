<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <link rel="icon" type="image/png" href="/public/wavelink-icon.png">
  <title>WaveLink</title>

  <!-- PWA Manifest (Android: nhận diện đây là audio app, ưu tiên process khi background) -->
  <link rel="manifest" href="/manifest.json">

  <!-- Theme color cho Android Chrome address bar -->
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple PWA (iOS Safari background audio support) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WaveLink">
  <link rel="apple-touch-icon" href="/wavelink-icon.png">

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- RemixIcon instant stylesheet to prevent square box cross glyph flash -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.min.css" crossorigin="anonymous">
</head>

<body class="flex flex-col min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
