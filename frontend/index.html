<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <link rel="icon" type="image/png" href="/public/wavelink-icon.png">
  <title>WaveLink</title>

  <!-- PWA Manifest (Android: nhận diện đây là audio app, ưu tiên process khi background) -->
  <link rel="manifest" href="/manifest.json">

  <!-- Theme color cho Android Chrome address bar -->
  <meta name="theme-color" content="#F6F5F0">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple PWA (iOS Safari background audio support) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WaveLink">
  <link rel="apple-touch-icon" href="/wavelink-icon.png">

  <!-- Anti-FOUC theme initializer -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('setting_theme');
        var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) {
          document.documentElement.classList.add('dark', 'dark-comic');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#141418');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- WaveLink Runtime Environment Config (Web Hosting Production) -->
  <script src="/env-config.js?v=2"></script>
</head>

<body class="flex flex-col min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
