<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" name="viewport">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <title>WaveLink — Nghe Audio, Sách Nói &amp; Podcast YouTube Tắt Màn Hình</title>
  <meta name="description" content="WaveLink là nền tảng nghe audio, sách nói, truyện audio và podcast YouTube phát nền tắt màn hình miễn phí, hỗ trợ tạo danh sách tập và cộng đồng chia sẻ.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://wavelink-audio-app.zhost.education/">

  <!-- Open Graph & Twitter Card -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WaveLink Audio">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="WaveLink — Nghe Audio, Sách Nói &amp; Podcast YouTube Tắt Màn Hình">
  <meta property="og:description" content="Nghe sách nói, truyện audio và podcast YouTube chạy nền tắt màn hình mượt mà trên mọi thiết bị.">
  <meta property="og:url" content="https://wavelink-audio-app.zhost.education/">
  <meta property="og:image" content="https://wavelink-audio-app.zhost.education/wavelink-icon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WaveLink — Nghe Audio, Sách Nói &amp; Podcast YouTube Tắt Màn Hình">
  <meta name="twitter:description" content="Nghe sách nói, truyện audio và podcast YouTube chạy nền tắt màn hình mượt mà.">
  <meta name="twitter:image" content="https://wavelink-audio-app.zhost.education/wavelink-icon.png">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "WaveLink Audio",
          "url": "https://wavelink-audio-app.zhost.education/",
          "inLanguage": "vi-VN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://wavelink-audio-app.zhost.education/library?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "name": "WaveLink Audio",
          "url": "https://wavelink-audio-app.zhost.education/",
          "logo": "https://wavelink-audio-app.zhost.education/wavelink-icon.png"
        }
      ]
    }
  </script>

  <!-- PWA Manifest (Android: nhận diện đây là audio app, ưu tiên process khi background) -->
  <link rel="manifest" href="/manifest.json">

  <!-- Theme color cho Android Chrome address bar -->
  <meta name="theme-color" content="#F6F5F0">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple PWA (iOS Safari background audio support) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WaveLink">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Anti-FOUC theme & Mobile WebView zoom-lock initializer -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('setting_theme');
        var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) {
          document.documentElement.classList.add('dark', 'dark-comic');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#141418');
        }
        var isWv = Boolean(window.ReactNativeWebView) || /\bwv\b|; wv\)|FBAN|FBAV|Zalo|Line\/|Instagram/i.test(navigator.userAgent || '');
        if (isWv) {
          document.documentElement.classList.add('wavelink-mobile-webview');
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect critical third-party origins -->
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
  <link rel="preconnect" href="https://img.youtube.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://perth-obj-blackberry-favor.trycloudflare.com">

  <!-- Fonts: Non-render-blocking async load with trimmed weights -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
  </noscript>

  <!-- WaveLink Runtime Environment Config (deferred so it never blocks HTML parse, executes before module scripts) -->
  <script defer src="/env-config.js?v=2"></script>
</head>

<body class="flex flex-col min-h-screen">
  <div id="root">
    <style>
      .wl-boot-shell{min-height:100vh;background:#F6F5F0;color:#111113;padding:72px 16px 32px;box-sizing:border-box}
      .wl-boot-wrap{max-width:72rem;margin:0 auto;display:flex;flex-direction:column;gap:20px}
      .wl-boot-card{background:#FFFFFF;border:2px solid #111113;border-radius:14px;box-shadow:3px 3px 0 #111113}
      .wl-boot-sk{background:linear-gradient(90deg,#E5E4DF 25%,#EEEDE8 50%,#E5E4DF 75%);background-size:200% 100%;animation:wl-shimmer 1.2s infinite linear;border-radius:8px}
      .wl-boot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
      @media(min-width:640px){.wl-boot-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
      @media(min-width:768px){.wl-boot-shell{padding-left:92px}.wl-boot-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
      @media(min-width:1024px){.wl-boot-shell{padding-left:256px}.wl-boot-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
      html.dark .wl-boot-shell{background:#141418;color:#F4F4F5}
      html.dark .wl-boot-card{background:#1E1F26;border-color:#2D2E38;box-shadow:3px 3px 0 #09090B}
      html.dark .wl-boot-sk{background:linear-gradient(90deg,#262832 25%,#323544 50%,#262832 75%);background-size:200% 100%}
      @keyframes wl-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    </style>
    <div class="wl-boot-shell" aria-busy="true" aria-label="Đang tải WaveLink Audio">
      <div class="wl-boot-wrap">
        <div class="wl-boot-card" style="padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;">
          <div style="display:flex;flex-direction:column;gap:8px;flex:1;">
            <div class="wl-boot-sk" style="height:12px;width:130px;"></div>
            <div class="wl-boot-sk" style="height:16px;width:230px;max-width:100%;"></div>
          </div>
          <div class="wl-boot-sk" style="height:26px;width:64px;"></div>
        </div>
        <div class="wl-boot-card" style="padding:16px;display:flex;gap:14px;align-items:center;">
          <div class="wl-boot-sk" style="width:96px;height:112px;flex-shrink:0;"></div>
          <div style="display:flex;flex-direction:column;gap:10px;flex:1;">
            <div class="wl-boot-sk" style="height:14px;width:90px;"></div>
            <div class="wl-boot-sk" style="height:18px;width:85%;"></div>
            <div class="wl-boot-sk" style="height:12px;width:55%;"></div>
            <div class="wl-boot-sk" style="height:10px;width:100%;margin-top:6px;"></div>
          </div>
        </div>
        <div style="display:flex;gap:8px;overflow:hidden;">
          <div class="wl-boot-sk" style="height:32px;width:84px;flex-shrink:0;"></div>
          <div class="wl-boot-sk" style="height:32px;width:92px;flex-shrink:0;"></div>
          <div class="wl-boot-sk" style="height:32px;width:88px;flex-shrink:0;"></div>
          <div class="wl-boot-sk" style="height:32px;width:96px;flex-shrink:0;"></div>
        </div>
        <div class="wl-boot-grid">
          <div style="display:flex;flex-direction:column;gap:8px;"><div class="wl-boot-card wl-boot-sk" style="aspect-ratio:3/4;"></div><div class="wl-boot-sk" style="height:14px;width:90%;"></div></div>
          <div style="display:flex;flex-direction:column;gap:8px;"><div class="wl-boot-card wl-boot-sk" style="aspect-ratio:3/4;"></div><div class="wl-boot-sk" style="height:14px;width:80%;"></div></div>
          <div style="display:flex;flex-direction:column;gap:8px;"><div class="wl-boot-card wl-boot-sk" style="aspect-ratio:3/4;"></div><div class="wl-boot-sk" style="height:14px;width:85%;"></div></div>
          <div style="display:flex;flex-direction:column;gap:8px;"><div class="wl-boot-card wl-boot-sk" style="aspect-ratio:3/4;"></div><div class="wl-boot-sk" style="height:14px;width:75%;"></div></div>
          <div style="display:flex;flex-direction:column;gap:8px;"><div class="wl-boot-card wl-boot-sk" style="aspect-ratio:3/4;"></div><div class="wl-boot-sk" style="height:14px;width:82%;"></div></div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:24px;max-width:1280px;margin:0 auto;">
        <h1>WaveLink — Nghe Audio, Sách Nói &amp; Podcast YouTube Tắt Màn Hình</h1>
        <p>Vui lòng bật JavaScript để nghe kho truyện audio và danh sách phát trên WaveLink.</p>
      </div>
    </noscript>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
